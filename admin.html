<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin</title>
<style>
body{margin:0;background:#0a0a12;color:#fff;font-family:system-ui,sans-serif;padding:40px 20px}
.box{max-width:500px;margin:0 auto;background:#151525;padding:30px;border-radius:16px}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;background:#202035;color:#fff;font-size:14px}
button{padding:12px 20px;background:#704df7;border:0;border-radius:8px;color:#fff;cursor:pointer;margin:8px 5px 0 0}
.hide{display:none}
hr{margin:15px 0;border-color:#333}
</style>
</head>
<body>
<script>
!function(n){let o=sessionStorage.getItem(n);o!=="ALLOW"&&(location.href="index.html");sessionStorage.removeItem(n)}("FROM_MAIN");
</script>
<div id="a1" class="box">
<h2>管理员登录</h2>
<input id="b1" type="password" placeholder="输入密钥">
<button onclick="x9()">登入</button>
</div>
<div id="c1" class="box hide">
<h2>后台控制面板</h2>
<hr>
<button onclick="m1()">添加</button>
<button onclick="m2()">移除</button>
<button onclick="m3()">编辑</button>
<button onclick="m4()">返回首页</button>
</div>
<script>
var _=String.fromCharCode;function z0(){let k=[49,50,51,52,53,54],s="";for(let q in k)s+=_(k[q]);return s}
function x9(){let t=document.getElementById("b1").value.trim();t===z0()?(document.a1.classList.add("hide"),document.c1.classList.remove("hide")):alert("密钥错误")}
function m1(){let n=prompt("名称");if(!n)return;let u=prompt("链接");if(!/^https?:\/\//.test(u))return alert("链接非法");let d=prompt("简介");if(!d)return;let arr=JSON.parse(localStorage.getItem("customCards")||"[]");arr.push({name:n,link:u,desc:d});localStorage.setItem("customCards",JSON.stringify(arr));location.href="index.html"}
function m2(){let arr=JSON.parse(localStorage.getItem("customCards")||"[]");if(!arr.length)return alert("无数据");let s=arr.map((v,i)=>(i+1)+"."+v.name).join("\n");let p=prompt(s+"\n序号");if(!p)return;arr.splice(p-1,1);localStorage.setItem("customCards",JSON.stringify(arr));location.href="index.html"}
function m3(){let arr=JSON.parse(localStorage.getItem("customCards")||"[]");if(!arr.length)return alert("无数据");let s=arr.map((v,i)=>(i+1)+"."+v.name).join("\n");let idx=prompt(s+"\n序号")-1;if(!arr[idx])return;let o=arr[idx],nn=prompt("改名",o.name),nu=prompt("改链接",o.link),nd=prompt("改简介",o.desc);if(!nn||!nd||!/^https?:\/\//.test(nu))return alert("内容异常");arr[idx]={name:nn,link:nu,desc:nd};localStorage.setItem("customCards",JSON.stringify(arr));location.href="index.html"}
function m4(){location.href="index.html"}
</script>
</body>
</html>
