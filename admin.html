<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin</title>
<style>
body{margin:0;background:#0a0a12;color:#fff;font-family:system-ui,sans-serif;padding:40px 20px}
.box{max-width:500px;margin:0 auto;background:#151525;padding:30px;border-radius:16px}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;background:#202035;color:#fff;font-size:14px;box-sizing:border-box}
button{padding:12px 20px;background:#704df7;border:0;border-radius:8px;color:#fff;cursor:pointer;margin:8px 5px 0 0}
button:disabled{background:#444;cursor:not-allowed;opacity:0.6}
button:active{opacity:0.8}
.tip{font-size:12px;color:#888;margin-top:10px}
</style>
</head>
<body>

// 入口权限校验：已登录直接放行，未登录必须从首页跳转
!function(a){
  if(sessionStorage.getItem("ADMIN") === "OK") return;
  let b = sessionStorage.getItem(a);
  if(b !== "ALLOW") location.href = "index.html";
  sessionStorage.removeItem(a);
}("FROM_MAIN");
</script>

<div id="loginBox" class="box">
  <h2>管理员登录</h2>
  <input id="pwdInput" type="password" placeholder="输入管理员密钥">
  <button id="loginBtn">登入</button>
  <p class="tip">10分钟无操作将自动登出</p>
</div>

<div id="adminPanel" class="box" style="display:none">
  <h2>控制面板</h2>
  <button id="addBtn">添加卡片</button>
  <button id="delBtn">删除卡片</button>
  <button id="editBtn">修改卡片</button>
  <button id="logoutBtn">退出登录</button>
  <p class="tip">已登录，数据将自动保存到本地</p>
</div>

<script>
!function(){
  let isAdmin = sessionStorage.getItem("ADMIN") === "OK";
  let isLogging = false;
  let autoLogoutTimer = null;

  // 🔑 管理员密钥：admin123（MD5哈希：21232f297a57a5a743894a0e4a801fc3）
  // 如需修改密码：计算新密码的MD5哈希替换此处即可
  const ADMIN_KEY_HASH = "21232f297a57a5a743894a0e4a801fc3";

  // 权限校验（所有操作前强制执行）
  function checkPermission(){
    if(!isAdmin){
      alert("无操作权限");
      return false;
    }
    resetAutoLogoutTimer();
    return true;
  }

  // 自动登出计时
  function resetAutoLogoutTimer(){
    if(autoLogoutTimer) clearTimeout(autoLogoutTimer);
    autoLogoutTimer = setTimeout(()=>{
      alert("长时间未操作，已自动登出");
      logout();
    }, 10 * 60 * 1000);
  }

  // 安全登出（精准清除权限）
  function logout(){
    isAdmin = false;
    sessionStorage.removeItem("ADMIN");
    if(autoLogoutTimer) clearTimeout(autoLogoutTimer);
    location.href = "index.html";
  }

  // ============== 核心功能 ==============
  function addCard(){
    if(!checkPermission()) return;
    let name = prompt("请输入卡片名称");
    if(!name || name.length > 50) return alert("名称无效（不能为空/超过50字）");
    let link = prompt("请输入卡片网址（必须http/https开头）");
    if(!/^https?:\/\//.test(link) || link.length > 200) return alert("网址格式无效");
    let desc = prompt("请输入卡片简介");
    if(!desc || desc.length > 200) return alert("简介无效");
    let arr = JSON.parse(localStorage.getItem("customCards")||"[]");
    arr.push({name, link, desc});
    localStorage.setItem("customCards", JSON.stringify(arr));
    alert("添加成功！");
    location.href="index.html";
  }

  function delCard(){
    if(!checkPermission()) return;
    let arr = JSON.parse(localStorage.getItem("customCards")||"[]");
    if(arr.length === 0) return alert("暂无数据可删除");
    let list = arr.map((v,i)=>`${i+1}. ${v.name}`).join("\n");
    let p = prompt(list + "\n请输入要删除的序号：");
    // 严格正整数校验
    if(!p || isNaN(p) || !Number.isInteger(Number(p)) || p<1 || p>arr.length){
      return alert("序号无效，请输入正整数");
    }
    arr.splice(parseInt(p)-1, 1);
    localStorage.setItem("customCards", JSON.stringify(arr));
    alert("删除成功！");
    location.href="index.html";
  }

  function editCard(){
    if(!checkPermission()) return;
    let arr = JSON.parse(localStorage.getItem("customCards")||"[]");
    if(arr.length === 0) return alert("暂无数据可修改");
    let list = arr.map((v,i)=>`${i+1}. ${v.name}`).join("\n");
    let p = prompt(list + "\n请输入要修改的序号：");
    if(!p || isNaN(p) || !Number.isInteger(Number(p)) || p<1 || p>arr.length){
      return alert("序号无效，请输入正整数");
    }
    let idx = parseInt(p)-1;
    let old = arr[idx];
    let newName = prompt("新名称", old.name);
    let newLink = prompt("新网址", old.link);
    let newDesc = prompt("新简介", old.desc);
    if(!newName || !newDesc || !/^https?:\/\//.test(newLink)) return alert("内容无效");
    arr[idx] = {name:newName, link:newLink, desc:newDesc};
    localStorage.setItem("customCards", JSON.stringify(arr));
    alert("修改成功！");
    location.href="index.html";
  }

  // ============== 初始化 ==============
  function bindEvents(){
    document.getElementById("addBtn").onclick = addCard;
    document.getElementById("delBtn").onclick = delCard;
    document.getElementById("editBtn").onclick = editCard;
    document.getElementById("logoutBtn").onclick = logout;
  }

  // 监听用户操作重置计时
  ["mousemove", "mousedown", "keydown", "scroll", "click"].forEach(evt=>{
    window.addEventListener(evt, resetAutoLogoutTimer);
  });

  // 已登录自动显示面板
  if(isAdmin){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    bindEvents();
    resetAutoLogoutTimer();
  }

  // 登录按钮点击
  document.getElementById("loginBtn").onclick = function(){
    if(isLogging) return;
    isLogging = true;
    this.disabled = true;

    let input = document.getElementById("pwdInput").value.trim();
    if(md5(input) === ADMIN_KEY_HASH){
      isAdmin = true;
      sessionStorage.setItem("ADMIN", "OK");
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      bindEvents();
      resetAutoLogoutTimer();
    }else{
      alert("密钥错误");
    }

    setTimeout(()=>{
      this.disabled = false;
      isLogging = false;
    }, 500);
  }

  // 支持回车登录
  document.getElementById("pwdInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") document.getElementById("loginBtn").click();
  });
}();
</script>
</body>
</html>
