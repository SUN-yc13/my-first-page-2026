<!-- 终极安全：必须从主页跳转，否则禁止访问 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<style>
body{margin:0;background:#0a0a12;color:#fff;font-family:system-ui,sans-serif;padding:40px 20px}
.box{max-width:500px;margin:0 auto;background:#151525;padding:30px;border-radius:16px}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;background:#202035;color:#fff}
button{padding:12px 20px;background:#704df7;border:none;border-radius:8px;color:#fff;cursor:pointer;margin-top:10px}
.hide{display:none}
</style>
</head>
<body>

<script>
// ========== 核心安全防护：必须从主页跳转 ==========
if (sessionStorage.getItem("FROM_MAIN") !== "ALLOW") {
  // 不是从主页来的 → 直接踢回主页
  location.href = "index.html";
}
// 一次性验证，用完即删
sessionStorage.removeItem("FROM_MAIN");
</script>

<div id="panel" class="box">
  <h2>管理员面板</h2>
  <button onclick="add()">添加卡片</button>
  <button onclick="del()">删除卡片</button>
  <button onclick="edit()">修改卡片</button>
  <button onclick="out()">返回主页</button>
</div>

<script>
// 添加
function add(){
  const name = prompt("输入名称");
  const link = prompt("输入网址");
  if (!link || !/^https?:\/\//.test(link)) {
    alert("无效网址！必须以 http/https 开头");
    return;
  }
  const data = JSON.parse(localStorage.getItem("customCards") || "[]");
  data.push({ name, link });
  localStorage.setItem("customCards", JSON.stringify(data));
  location.href = "index.html";
}

// 删除
function del(){
  const data = JSON.parse(localStorage.getItem("customCards") || "[]");
  if (data.length === 0) { alert("无数据"); return; }
  const list = data.map((i,j) => `${j+1}. ${i.name}`).join("\n");
  const idx = prompt("输入序号：\n" + list);
  if (idx) {
    data.splice(idx - 1, 1);
    localStorage.setItem("customCards", JSON.stringify(data));
    location.href = "index.html";
  }
}

// 修改
function edit(){
  const data = JSON.parse(localStorage.getItem("customCards") || "[]");
  if (data.length === 0) { alert("无数据"); return; }
  const list = data.map((i,j) => `${j+1}. ${i.name}`).join("\n");
  const idx = prompt("输入序号：\n" + list) - 1;
  if (!data[idx]) return;
  const name = prompt("新名称", data[idx].name);
  const link = prompt("新网址", data[idx].link);
  if (!link || !/^https?:\/\//.test(link)) {
    alert("无效网址！");
    return;
  }
  data[idx] = { name, link };
  localStorage.setItem("customCards", JSON.stringify(data));
  location.href = "index.html";
}

// 退出
function out(){
  location.href = "index.html";
}
</script>
</body>
</html>
