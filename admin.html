<!-- 管理员后台 - 独立页面 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员面板</title>
<style>
body{margin:0;background:#0a0a12;color:#fff;font-family:system-ui,sans-serif;padding:40px 20px}
.box{max-width:500px;margin:0 auto;background:#151525;padding:30px;border-radius:16px}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;background:#202035;color:#fff}
button{padding:12px 20px;background:#704df7;border:none;border-radius:8px;color:#fff;margin-top:10px;cursor:pointer}
.btn{margin:5px}
.hide{display:none}
</style>
</head>
<body>
<div class="box" id="login"><h2>管理员登录</h2><input id="pwd" placeholder="输入密码"><button onclick="log()">登录</button></div>
<div class="box hide" id="panel"><h2>管理面板</h2><button onclick="add()">添加</button><button onclick="del()">删除</button><button onclick="edit()">修改</button><button onclick="logout()">退出</button></div>

<script>
const _0x2=function(){let a=[];return function(b){a.push(b);return a.join('');}}();
function log(){const v=document.getElementById('pwd').value;if(v===[1,2,3,4,5,6].join('')){document.getElementById('login').classList.add('hide');document.getElementById('panel').classList.remove('hide');}}
function add(){const n=prompt('名称');const u=prompt('网址');if(!u||!/^https?:\/\//.test(u)){alert('请输入有效网址');return;}const d=JSON.parse(localStorage.getItem('customCards')||[]);d.push({name:n,link:u});localStorage.setItem('customCards',JSON.stringify(d));location.href='index.html';}
function del(){const d=JSON.parse(localStorage.getItem('customCards')||[]);const s=d.map((i,j)=>`${j+1}.${i.name}`).join('\n');const i=prompt(s);if(i){d.splice(i-1,1);localStorage.setItem('customCards',JSON.stringify(d));location.href='index.html';}}
function edit(){const d=JSON.parse(localStorage.getItem('customCards')||[]);const s=d.map((i,j)=>`${j+1}.${i.name}`).join('\n');const i=prompt(s)-1;if(d[i]){const n=prompt('名称',d[i].name);const u=prompt('网址',d[i].link);if(!u||!/^https?:\/\//.test(u)){alert('网址无效');return;}d[i]={name:n,link:u};localStorage.setItem('customCards',JSON.stringify(d));location.href='index.html';}}
function logout(){location.href='index.html';}
</script>
</body>
</html>
